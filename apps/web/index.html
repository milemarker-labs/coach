    <meta name="theme-color" content="#0b0d17" />
    <!-- Sets the theme before first paint: the stored choice, else the system setting. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("coach-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f2f0eb" : "#0b0d17");
      })();
    </script>
